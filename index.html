<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Gelug</title>
  <meta name="description" content="Mix ambient sounds such as rain, thunderstorm, ocean waves and white noise to focus, relax and sleep.">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:title" content="Gelug">
  <meta property="og:description" content="Mix ambient sounds to focus, relax and sleep.">
  <meta property="og:image" content="https://rubenaraujo.github.io/project_gelug/assets/og-image.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="shortcut icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="stylesheet" href="assets/css/gelug.css">
</head>

<body>

  <div class="flex-container">
    <div id="toolbar">
      <button id="btn-install" hidden data-i18n="install" data-i18n-title="installTitle">Install</button>
      <button id="btn-wakelock" hidden aria-pressed="false" data-i18n="wakelock" data-i18n-title="wakelockTitle">Keep screen on</button>
      <div id="timer">
        <button id="btn-timer" aria-expanded="false" aria-controls="timer-panel" data-i18n-title="timerTitle">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span id="btn-timer-label" data-i18n="timer">Sleep timer</span>
        </button>
        <div id="timer-panel" role="dialog" data-i18n-aria="timer" aria-label="Sleep timer" hidden>
          <p class="timer-hint" data-i18n="timerHint">Fades out slowly, then mutes</p>
          <div class="timer-readout"><span id="timer-value">5</span><small id="timer-unit" data-i18n="min">min</small></div>
          <input id="timer-minutes" type="range" min="1" max="15" value="5" data-i18n-aria="minutes" aria-label="Minutes">
          <div class="timer-presets">
            <button type="button" data-minutes="5">5</button>
            <button type="button" data-minutes="10">10</button>
            <button type="button" data-minutes="15">15</button>
          </div>
          <button id="btn-timer-start" type="button">Start</button>
        </div>
      </div>
      <button id="btn-lang" data-i18n-title="langTitle" title="Mudar para Português" aria-label="Mudar para Português">PT</button>
      <button id="btn-mute" class="flex-item fa fa-volume-up active" title="Mute/Unmute" aria-label="Mute"></button>
    </div>
    <div class="logo"><img src="assets/mark.png" alt=""><span>Gelug</span></div>

    <div id="sound-types" class="flex-container flex-item">
      <div data-key="rain" class="flex-container flex-item">
        <img src="assets/images/rain.png" alt="Rain" title="Rain" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="thunderstorm" class="flex-container flex-item">
        <img src="assets/images/thunderstorm.png" alt="Thunderstorm" title="Thunderstorm" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="wind" class="flex-container flex-item">
        <img src="assets/images/wind.png" alt="Wind" title="Wind" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="forest" class="flex-container flex-item">
        <img src="assets/images/forest.png" alt="Forest" title="Forest" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="leaves" class="flex-container flex-item">
        <img src="assets/images/leaves.png" alt="Leaves" title="Leaves" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="waterstream" class="flex-container flex-item">
        <img src="assets/images/waterstream.png" alt="Water Stream" title="Water Stream" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="seaside" class="flex-container flex-item">
        <img src="assets/images/seaside.png" alt="Seaside" title="Seaside" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="water" class="flex-container flex-item">
        <img src="assets/images/water.png" alt="Water" title="Water" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="fire" class="flex-container flex-item">
        <img src="assets/images/fire.png" alt="Fire" title="Fire" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="summernight" class="flex-container flex-item">
        <img src="assets/images/summernight.png" alt="Summer Night" title="Summer Night" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="coffee" class="flex-container flex-item">
        <img src="assets/images/coffee.png" alt="Coffee" title="Coffee" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="train" class="flex-container flex-item">
        <img src="assets/images/train.png" alt="Train" title="Train" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="fan" class="flex-container flex-item">
        <img src="assets/images/fan.png" alt="Fan" title="Fan" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="washingmachine" class="flex-container flex-item">
        <img src="assets/images/washingmachine.svg" alt="Washing Machine" title="Washing Machine" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="garden" class="flex-container flex-item">
        <img src="assets/images/garden.svg" alt="Garden" title="Garden" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="underwater" class="flex-container flex-item">
        <img src="assets/images/underwater.svg" alt="Underwater" title="Underwater" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="spaceship" class="flex-container flex-item">
        <img src="assets/images/spaceship.svg" alt="Spaceship" title="Spaceship" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="waterfall" class="flex-container flex-item">
        <img src="assets/images/waterfall.svg" alt="Waterfall" title="Waterfall" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="car" class="flex-container flex-item">
        <img src="assets/images/car.svg" alt="Car" title="Car" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="airplane" class="flex-container flex-item">
        <img src="assets/images/airplane.svg" alt="Airplane" title="Airplane" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="whitenoise" class="flex-container flex-item">
        <img src="assets/images/whitenoise.png" alt="White noise" title="White noise" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="pinknoise" class="flex-container flex-item">
        <img src="assets/images/pinknoise.png" alt="Pink noise" title="Pink noise" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
      <div data-key="brownnoise" class="flex-container flex-item">
        <img src="assets/images/brownnoise.png" alt="Brown noise" title="Brown noise" class="flex-item">
        <input type="range" min="0" max="100" class="flex-item">
      </div>
    </div>
    <br>
    <small class="text-1 footer">
      <br>
      <span data-i18n="credit">developed by Ruben Araujo</span>
      <br>
      <br>
    </small>
  </div>

  <script src="assets/js/gelug.js" charset="utf-8"></script>
</body>

</html>
